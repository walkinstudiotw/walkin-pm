name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # 手動觸發（Actions tab → Run workflow）

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新 push 進來時排隊而不取消進行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
